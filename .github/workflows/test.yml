name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:reader-ui
      - run: python scripts/reader_assets.py --check
      - name: Install the pinned workflow-test parser
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm run test:react
