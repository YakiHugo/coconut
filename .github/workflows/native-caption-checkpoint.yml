name: Native caption build checkpoint
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-caption-checkpoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  caption-helper:
    if: github.head_ref == 'dot/bundled-video-captions' && github.event.pull_request.head.repo.full_name == github.repository
    name: Native caption helper (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, arch: arm64}
          - {os: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
          architecture: ${{ matrix.arch }}
      - name: Create isolated hash-pinned no-extras build environment
        run: |
          python -m venv "$RUNNER_TEMP/coconut-helper-venv"
          "$RUNNER_TEMP/coconut-helper-venv/bin/python" -m pip install --no-deps --only-binary=:all: --require-hashes -r desktop/caption-helper-requirements.txt
      - name: Freeze native helper and audit bundled runtime
        run: '"$RUNNER_TEMP/coconut-helper-venv/bin/python" scripts/build_caption_helper.py'
      - name: Prove native helper offline without user Python
        run: node tests/desktop-caption-helper-proof.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: caption-helper-darwin-${{ matrix.arch }}
          path: desktop/helper-build/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
  mac-package:
    needs: [caption-helper]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: caption-helper-darwin-arm64
          path: desktop/helper-build/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: caption-helper-darwin-x64
          path: desktop/helper-build/darwin-x64
      - run: npm ci --prefix desktop
      - name: Install packaged-app acceptance tools without browser downloads
        run: npm ci --ignore-scripts
      - name: Run the real Electron reader without model calls
        run: COCONUT_SMOKE_TEST=1 desktop/node_modules/.bin/electron desktop
      - name: Package unsigned arm64 and x64 apps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac --prefix desktop
      - name: Verify package contents
        run: |
          for archive in desktop/dist/*.zip; do
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/app.asar'
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/reader/index.html'
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/LICENSE.electron'
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/LICENSES.chromium.html'
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/caption-helper/coconut-caption'
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/caption-helper/notices/LICENSE.certifi'
            unzip -l "$archive" | grep 'Coconut.app/Contents/Resources/caption-helper/sources/certifi-2026.7.22.tar.gz'
          done
      - name: Start the packaged app on the native runner architecture
        run: |
          arch="$(node -p 'process.arch')"
          COCONUT_SMOKE_TEST=1 "desktop/dist/Coconut-darwin-$arch/Coconut.app/Contents/MacOS/Coconut"
      - name: Verify native release ZIP reading, playback, exports and restart recovery
        run: node tests/desktop-packaged-acceptance.mjs
      - name: Upload unsigned developer builds only
        uses: actions/upload-artifact@v4
        with:
          name: Coconut-macOS-unsigned
          path: desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 7
