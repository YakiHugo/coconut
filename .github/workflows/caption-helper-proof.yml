name: Guarded caption helper proof
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: caption-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-x-captions:
    if: github.head_ref == 'dot/bundled-video-captions' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the pinned official extractor
        run: python -m pip install --disable-pip-version-check --no-input --no-deps yt-dlp==2026.8.19
      - name: Verify pinned extractor denial and downloader guards offline
        run: python -m unittest discover -s tests -p test_public_x_caption_proof.py -v
      - name: Verify guarded public guest captions without media or ASR
        timeout-minutes: 3
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONNOUSERSITE: '1'
          YTDLP_NO_PLUGINS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: timeout 150s python -B scripts/prove_public_x_captions.py
      - name: Remove ephemeral caption output
        if: always()
        run: rm -rf -- "$RUNNER_TEMP"/coconut-public-caption-*
