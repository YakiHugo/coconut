name: Public ingestion closure evidence
on:
  pull_request:
    paths:
      - '.github/workflows/ingestion-public-proof.yml'
      - 'scripts/live_ingestion_proof.mjs'
      - 'scripts/public_video_caption_guard.py'
      - 'tests/test_public_video_caption_guard.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingestion-public-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xiaoyuzhou-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify public episode, guarded audio download, decoding and seek
        run: COCONUT_LIVE_PODCAST_MEDIA=1 node tests/podcast-public-smoke.mjs
# No account, credentials, paid inference or model download. A media pass is not
# a transcription pass. Source bodies remain transient; only caption metadata
# reports may be uploaded. Blocked/unverified source checks fail rather than skip.

  reader-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx tsc -p frontend/tsconfig.json
      - run: node --test tests/react-ingestion-media.test.mjs tests/react-ingestion-binding.test.mjs tests/react-ingestion-jobs.test.mjs tests/react-video-audio.test.mjs tests/desktop-video-audio.test.mjs
      - run: python -m unittest discover -s tests -p 'test_public_video_media.py' -v
      - run: npm run build:reader-ui
      - run: npx playwright install --with-deps chromium
      - name: Generate authored playable MP4 for browser proof
        run: |
          python -m venv .venv-video-fixture
          .venv-video-fixture/bin/python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps av==16.1.0
          .venv-video-fixture/bin/python scripts/create_authored_mp4.py
      - run: node tests/react-video-audio-browser.mjs
      - name: Return exact generated public reader assets for review
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          for(const path of ['reader/react-app.js','reader/react-app.css','reader/index.html']){
            const bytes=await readFile(path),base64=bytes.toString('base64'),sha256=createHash('sha256').update(bytes).digest('hex');
            for(let offset=0;offset<base64.length;offset+=8000)console.log('COCONUT_READER_ASSET '+JSON.stringify({path,offset,total:base64.length,sha256,data:base64.slice(offset,offset+8000)}));
          }
          NODE
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm runner resources before any ASR dependency or weight download
        run: |
          python - <<'PY'
          import json, os, shutil
          memory = os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES')
          free = shutil.disk_usage('.').free
          report = {'check': 'cloud_asr_resource_preflight', 'memory_bytes': memory, 'free_disk_bytes': free, 'cpu_count': os.cpu_count(), 'minimum_memory_bytes': 6 * 1024**3, 'minimum_disk_bytes': 6 * 1024**3, 'model_downloaded': False}
          print(json.dumps(report))
          assert memory >= report['minimum_memory_bytes'] and free >= report['minimum_disk_bytes'] and os.cpu_count() >= 2
          PY
      - name: Inspect short public episode candidates without downloading media
        run: |
          node --input-type=module <<'NODE'
          import {createPodcastSources} from './desktop/podcast-sources.mjs';
          const sources=createPodcastSources();
          for(const id of ['65e7c944d602439838b530aa','6844f0eb6dbe9284e74ec2a8']){
            try{
              const data=await sources.discover({url:'https://www.xiaoyuzhoufm.com/episode/'+id},{signal:AbortSignal.timeout(20000)});
              const episode=data.episodes?.[0],media=episode?.media?.[0];
              console.log(JSON.stringify({check:'short_xiaoyuzhou_candidate',id,public_gates_passed:true,episodes:data.episodes.length,duration:episode.duration,bytes:media?.length,mime:media?.type,transcripts:episode.transcripts.length}));
            }catch{console.log(JSON.stringify({check:'short_xiaoyuzhou_candidate',id,public_gates_passed:false}));}
          }
          NODE

  public-local-asr:
    strategy:
      fail-fast: false
      matrix:
        provider: [xiaoyuzhou, bilibili]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_CACHE: /tmp/coconut-proof-hf-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check disposable standard runner resources before installing or downloading
        run: |
          python - <<'PY'
          import json, os, shutil
          memory = os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES')
          free = shutil.disk_usage('.').free
          print(json.dumps({'check':'asr_preflight','memory_bytes':memory,'free_disk_bytes':free,'cpu_count':os.cpu_count(),'planned_model':'Systran/faster-whisper-small','approx_weight_bytes':486000000,'paid_inference':False}))
          assert memory >= 6*1024**3 and free >= 6*1024**3 and os.cpu_count() >= 2
          PY
          # faster-whisper decodes with the explicitly installed PyAV wheel; no ffmpeg CLI is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare explicitly approved ephemeral optional ASR environment
        run: |
          npm ci --ignore-scripts
          python -m venv .venv-proof
          .venv-proof/bin/python -m pip install --disable-pip-version-check --no-input --only-binary=:all: faster-whisper==1.2.1 av==16.1.0
      - name: Prepare pinned caption dependencies for public video proof
        if: matrix.provider == 'bilibili'
        run: .venv-proof/bin/python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps -r desktop/development-caption-requirements.txt
      - name: Prepare official small open weights, pinned to the resolved public revision
        timeout-minutes: 5
        run: |
          .venv-proof/bin/python - <<'PY'
          import importlib.metadata, json, os, re
          from huggingface_hub import model_info, snapshot_download
          repository = 'Systran/faster-whisper-small'
          revision = model_info(repository, token=False).sha
          assert re.fullmatch(r'[0-9a-f]{40}', revision)
          location = snapshot_download(repository, revision=revision, token=False, allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.json','vocabulary.txt'])
          from local_asr import cached_model_path, executor_status
          assert str(cached_model_path()) == location
          status = executor_status()
          assert status['available'] and not status['model_download'] and status['local_only']
          versions = {name:importlib.metadata.version(name) for name in ['faster-whisper','ctranslate2','av','huggingface-hub']}
          print(json.dumps({'check':'explicit_ephemeral_model_preparation','repository':repository,'revision':revision,'versions':versions,'status':status}))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('COCONUT_PROOF_MODEL_REVISION='+revision+'\n')
          PY
      - name: Exercise real public media, offline ASR, frontend controller and durable original project
        timeout-minutes: 12
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: COCONUT_ASR_PROOF_PYTHON="$PWD/.venv-proof/bin/python" node scripts/live_ingestion_proof.mjs --live ${{ matrix.provider }}
      - name: Remove temporary weights and optional environment
        if: always()
        run: rm -rf -- "$HF_HUB_CACHE" .venv-proof
