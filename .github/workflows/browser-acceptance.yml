name: Browser acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      original_video_url:
        description: 'Optional public single-video URL for a real captions-only production-queue browser acceptance'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Verify standalone Web reading without a Python service
        env:
          COCONUT_UI_SCREENSHOTS: ${{ runner.temp }}/coconut-authored-ui
        run: node tests/web-browser-acceptance.mjs
      - name: Verify 1,771-cue bilingual reading and recovery with authored fixtures
        env:
          COCONUT_UI_SCREENSHOTS: ${{ runner.temp }}/coconut-authored-ui
        run: node tests/long-reading-browser.mjs
      - name: Verify AI request ownership and explicit retry with injected responses only
        env:
          COCONUT_UI_SCREENSHOTS: ${{ runner.temp }}/coconut-authored-ui
        run: node tests/ai-recovery-browser.mjs
      - name: Verify deep-reading audio controls and notes with authored short cues
        env:
          COCONUT_UI_SCREENSHOTS: ${{ runner.temp }}/coconut-authored-ui
        run: node tests/playback-dock-browser.mjs
      - name: Verify latest local-file selection and navigation ownership with authored files
        run: node tests/import-order-browser.mjs
      - name: Verify native reload protection after user activation with authored reading changes
        run: node tests/reader-unload-browser.mjs
      - name: Verify native SRT and VTT import, notes, failed files and actual download recovery
        run: node tests/subtitle-import-browser.mjs
      - name: Verify bounded long-summary plans with injected fixtures only
        run: node tests/summary-browser-acceptance.mjs
      - name: Verify explicit podcast source imports through the desktop HTTP bridge
        run: node tests/podcast-browser-acceptance.mjs
      - name: Verify audio project to transcript, injected AI, playback and clean-browser recovery
        run: node tests/project-continuity-browser.mjs
      - name: Probe anonymous video caption feasibility without enabling import
        if: github.event_name == 'pull_request' && github.head_ref == 'dot/primary-journey'
        run: node scripts/probe_public_captions.mjs
      - name: Prepare original synthetic media and timed text
        run: python scripts/prepare_browser_acceptance.py --mode synthetic --directory "$RUNNER_TEMP/coconut-acceptance"
      - name: Verify actual browser playback, reading, downloads and restore
        env:
          COCONUT_ACCEPTANCE_MODE: synthetic
          COCONUT_ACCEPTANCE_DATA_DIR: ${{ runner.temp }}/coconut-acceptance
          COCONUT_ACCEPTANCE_RESULT: ${{ runner.temp }}/coconut-acceptance/acceptance-result.json
        run: npm run test:browser
      - name: Upload authored UI review images only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Coconut-authored-UI
          path: ${{ runner.temp }}/coconut-authored-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary media and exports
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/coconut-acceptance"

  original-sample:
    # The original X sample is scoped to this acceptance PR. Other PRs and main
    # do not repeatedly download it; a manual run must explicitly supply a URL.
    if: >-
      (github.event_name == 'pull_request' &&
       github.head_ref == 'dot/close-reading-gaps' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.original_video_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install yt-dlp==2026.8.19
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Submit the original URL in Chromium and verify the actual production queue
        env:
          COCONUT_ORIGINAL_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.original_video_url || 'https://x.com/VaibhavSisinty/status/2105733670493651236?s=20' }}
        # Installs only yt-dlp above, never the ASR requirements or recognition
        # models. The browser explicitly submits captions_only=true; unavailable
        # captions stop the job. All source/log bytes are transient and private.
        run: node tests/queued-original-browser.mjs
      - name: Remove original media, captions, exports and private logs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP"/coconut-queued-original-*

# Only the static Web test writes review images, using authored synthetic fixtures.
# Original source media, captions, storage, traces and downloads are never artifacts.
